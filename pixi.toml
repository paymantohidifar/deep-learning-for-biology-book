[workspace]
name = "dlfb"
version = "0.1.0"
description = "Deep Learning for Biology Book"
authors = ["Payman Tohidifar <payman.tohidifar@gmail.com>"]
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.11.*"

[feature.base.dependencies]
numpy = "==2.1.2"
pandas = "==2.2.2"
scikit-learn = "==1.4.2"
matplotlib = "==3.10.1"
seaborn = "==0.13.2"
pixi-kernel = "*"
jupyter = ">=1.1.1,<2"

[feature.base.pypi-dependencies]
adjusttext = "==1.3.0"
flax = "==0.10.4"
jax = "==0.5.1"
jaxlib = "==0.5.1"
triton = ">3"
ml-dtypes = "==0.5.1"
tensorstore = "==0.1.72"
orbax-checkpoint = "==0.11.9"
optax = "==0.2.4"
click = "<8.2"
typer = "==0.7.0"
ipinfo = "==5.1.1"
google-cloud-storage = "==3.0.0"
parfive = "==2.2.0"
types-tqdm = "==4.67.0.20250516"
types-tensorflow = "==2.18.0.20250516"
pandas-stubs = "==2.2.3.250527"
types-seaborn = "==0.13.2.20250516"
types-networkx = "==3.5.0.20250610"
scipy-stubs = "==1.15.3.0"
python-dotenv = ">=1.2.2, <2"
dlfb = { path = ".", editable = true }

[feature.proteins.dependencies]
biopython = "==1.85"

[feature.proteins.pypi-dependencies]
py3dmol = "==2.1.0"
obonet = "==1.0.0"
datasets = "==2.19.1"
transformers = "==4.49.0"
torch = "==2.6.0"
torchvision = "==0.21.0"
tensorflow = "==2.19.0"
tensorflow-datasets = "==4.9.8"

[feature.cancer.pypi-dependencies]
dm-pix = "==0.4.4"
transformers = "==4.49.0"

[feature.graphs.pypi-dependencies]
ogb = "==1.3.6"
jraph = "==0.0.6.dev0"
ml-collections = "==0.1.1"

[feature.localization.pypi-dependencies]
umap-learn = "==0.5.6"

[feature.gpu.pypi-dependencies]
jax-cuda12-pjrt = "==0.5.1"
jax-cuda12-plugin = "==0.5.1"

[workspace.pypi-options]
# Explicit transitive constraint overrides targeting upstream HuggingFace & Traitlets versioning leaks
dependency-overrides = { "traitlets" = "==5.7.1", "huggingface-hub" = "==0.36.0" }

[environments]
default = { features = ["base"], no-default-feature = false }
proteins = { features = ["base", "proteins", "gpu"], no-default-feature = false }
dna = { features = ["base", "gpu"], no-default-feature = false }
graphs = { features = ["base", "graphs", "gpu"], no-default-feature = false }
cancer = { features = ["base", "cancer", "gpu"], no-default-feature = false }
localization = { features = ["base", "localization", "gpu"], no-default-feature = false }
