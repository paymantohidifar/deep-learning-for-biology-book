[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
name = "dlfb"
version = "0.1.0"
description = "Personal notes for Deep Learning for Biology Book"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy==2.1.2",
    "pandas==2.2.2",
    "scikit-learn==1.4.2",
    "matplotlib==3.10.1",
    "seaborn==0.13.2",
    "pixi-kernel",
    "jupyter>=1.1.1,<2",
    "adjusttext==1.3.0",
    "flax==0.10.4",
    "jax==0.5.1",
    "jaxlib==0.5.1",
    "triton>3",
    "ml-dtypes==0.5.1",
    "tensorstore==0.1.72",
    "orbax-checkpoint==0.11.9",
    "optax==0.2.4",
    "click<8.2",
    "typer==0.7.0",
    "ipinfo==5.1.1",
    "google-cloud-storage==3.0.0",
    "parfive==2.2.0",
    "types-tqdm==4.67.0.20250516",
    "types-tensorflow==2.18.0.20250516",
    "pandas-stubs==2.2.3.250527",
    "types-seaborn==0.13.2.20250516",
    "types-networkx==3.5.0.20250610",
    "scipy-stubs==1.15.3.0",
    "python-dotenv>=1.2.2,<2",
]

[project.optional-dependencies]
proteins = [
    "biopython==1.85",
    "py3dmol==2.1.0",
    "obonet==1.0.0",
    "datasets==2.19.1",
    "transformers==4.49.0",
    "tensorflow==2.19.0",
    "tensorflow-datasets==4.9.8",
    "torch==2.6.0",
    "torchvision==0.21.0",
]
proteins-cpu = [
    "biopython==1.85",
    "py3dmol==2.1.0",
    "obonet==1.0.0",
    "datasets==2.19.1",
    "transformers==4.49.0",
    "tensorflow==2.19.0",
    "tensorflow-datasets==4.9.8",
    "torch==2.6.0",
    "torchvision==0.21.0",
]
cancer = ["dm-pix==0.4.4", "transformers==4.49.0"]
graphs = ["ogb==1.3.6", "jraph==0.0.6.dev0", "ml-collections==0.1.1", "torch==2.10.0"]
graphs-cpu = ["ogb==1.3.6", "jraph==0.0.6.dev0", "ml-collections==0.1.1", "torch==2.10.0"]
localization = ["umap-learn==0.5.6"]
gpu = ["jax-cuda12-pjrt==0.5.1", "jax-cuda12-plugin==0.5.1"]

# --- UV index config: routes torch to CPU-only wheels for the "-cpu" extras ---
[tool.uv]
conflicts = [
    [{ extra = "proteins" }, { extra = "proteins-cpu" }],
    [{ extra = "graphs" }, { extra = "graphs-cpu" }],
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", extra = "proteins-cpu" }, { index = "pytorch-cpu", extra = "graphs-cpu" }]
torchvision = [{ index = "pytorch-cpu", extra = "proteins-cpu" }]

[project.scripts]
dlfb-provision = "dlfb.provision:app"

[tool.hatch.build.targets.wheel]
packages = ["src/dlfb"]

# --- Pixi Configuration (read by local Pixi installations) ---
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
python = "3.11.*"

[tool.pixi.workspace.pypi-options]
# Explicit transitive constraint overrides targeting upstream HuggingFace & Traitlets versioning leaks
dependency-overrides = { "traitlets" = "==5.7.1", "huggingface-hub" = "==0.36.0" }

[tool.pixi.feature.base.dependencies]
numpy = "==2.1.2"
pandas = "==2.2.2"
scikit-learn = "==1.4.2"
matplotlib = "==3.10.1"
seaborn = "==0.13.2"
pixi-kernel = "*"
jupyter = ">=1.1.1,<2"

[tool.pixi.feature.base.pypi-dependencies]
adjusttext = "==1.3.0"
flax = "==0.10.4"
jax = "==0.5.1"
jaxlib = "==0.5.1"
triton = ">3"
ml-dtypes = "==0.5.1"
tensorstore = "==0.1.72"
orbax-checkpoint = "==0.11.9"
optax = "==0.2.4"
click = "<8.2"
typer = "==0.7.0"
ipinfo = "==5.1.1"
google-cloud-storage = "==3.0.0"
parfive = "==2.2.0"
types-tqdm = "==4.67.0.20250516"
types-tensorflow = "==2.18.0.20250516"
pandas-stubs = "==2.2.3.250527"
types-seaborn = "==0.13.2.20250516"
types-networkx = "==3.5.0.20250610"
scipy-stubs = "==1.15.3.0"
python-dotenv = ">=1.2.2, <2"
dlfb = { path = ".", editable = true }

# Deps shared by the GPU and CPU proteins environments (everything except torch/torchvision)
[tool.pixi.feature.proteins-common.dependencies]
biopython = "==1.85"

[tool.pixi.feature.proteins-common.pypi-dependencies]
py3dmol = "==2.1.0"
obonet = "==1.0.0"
datasets = "==2.19.1"
transformers = "==4.49.0"
tensorflow = "==2.19.0"
tensorflow-datasets = "==4.9.8"

# torch/torchvision resolved from the default (CUDA-enabled) wheels, paired with the "gpu" feature
[tool.pixi.feature.proteins.pypi-dependencies]
torch = "==2.6.0"
torchvision = "==0.21.0"

# torch/torchvision pinned to PyTorch's CPU-only wheel index so no CUDA binaries are pulled in
[tool.pixi.feature.proteins-cpu.pypi-dependencies]
torch = { version = "==2.6.0", index = "https://download.pytorch.org/whl/cpu" }
torchvision = { version = "==0.21.0", index = "https://download.pytorch.org/whl/cpu" }

[tool.pixi.feature.cancer.pypi-dependencies]
dm-pix = "==0.4.4"
transformers = "==4.49.0"

[tool.pixi.feature.graphs-common.pypi-dependencies]
ogb = "==1.3.6"
jraph = "==0.0.6.dev0"
ml-collections = "==0.1.1"

# ogb transitively requires torch; pin it explicitly so the CUDA vs. CPU wheel is under our control
[tool.pixi.feature.graphs.pypi-dependencies]
torch = "==2.10.0"

[tool.pixi.feature.graphs-cpu.pypi-dependencies]
torch = { version = "==2.10.0", index = "https://download.pytorch.org/whl/cpu" }

[tool.pixi.feature.localization.pypi-dependencies]
umap-learn = "==0.5.6"

[tool.pixi.feature.gpu.pypi-dependencies]
jax-cuda12-pjrt = "==0.5.1"
jax-cuda12-plugin = "==0.5.1"

[tool.pixi.environments]
default = { features = ["base"], no-default-feature = false }
proteins = { features = ["base", "proteins-common", "proteins", "gpu"], no-default-feature = false }
proteins-cpu = { features = ["base", "proteins-common", "proteins-cpu"], no-default-feature = false }
dna = { features = ["base", "gpu"], no-default-feature = false }
dna-cpu = { features = ["base"], no-default-feature = false }
graphs = { features = ["base", "graphs-common", "graphs", "gpu"], no-default-feature = false }
graphs-cpu = { features = ["base", "graphs-common", "graphs-cpu"], no-default-feature = false }
cancer = { features = ["base", "cancer", "gpu"], no-default-feature = false }
cancer-cpu = { features = ["base", "cancer"], no-default-feature = false }
localization = { features = ["base", "localization", "gpu"], no-default-feature = false }
localization-cpu = { features = ["base", "localization"], no-default-feature = false }
